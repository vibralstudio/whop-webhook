<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Viral Growth Blueprint · Vibral</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,700;125,800;125,900&family=Inter:wght@300;400;500;600;700;800&display=swap">
<style>
/* Layout: tool-first member app. Top tab rail on desktop, bottom bar on phones. Every tab is something you use. Vibral black/gold, Archivo Expanded display. Single dark world by choice. */
:root{
  --bg:#0a0a0b;--surface:#111113;--surface-2:#17171a;
  --line:rgba(243,241,234,.08);--line-2:rgba(243,241,234,.14);
  --gold:#c9a24b;--gold-soft:#a98a4c;--gold-dim:rgba(201,162,75,.14);
  --ink:#f3f1ea;--text:#c3c1bb;--muted:#7c7a74;
  --good:#86ad74;--good-dim:rgba(134,173,116,.14);--warn:#d98a4a;--warn-dim:rgba(217,138,74,.14);--bad:#c65b52;
  --display:'Archivo','Arial Black',system-ui,sans-serif;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --r:10px;color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-variant-numeric:lining-nums;font-feature-settings:"lnum" 1}
html,body{background:var(--bg)}
body{color:var(--text);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding-inline:20px;padding-block:0 48px}
h1,h2,h3{color:var(--ink);text-wrap:balance;margin:0}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--text);white-space:nowrap}
.chip.good{background:var(--good-dim);border-color:transparent;color:var(--good)}
.chip.warn{background:var(--warn-dim);border-color:transparent;color:var(--warn)}
.chip.goldc{background:var(--gold-dim);border-color:transparent;color:var(--gold)}
button.chip:hover{border-color:var(--gold-soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;padding:10px 16px;font-weight:700;font-size:14px;border:1px solid var(--line-2);background:var(--surface-2);text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--gold-soft)}
.btn.primary{background:var(--gold);color:#16130a;border-color:var(--gold)}
.btn.primary:hover{background:#d6b05a}
.btn.ok{background:var(--good);border-color:var(--good);color:#0e1a0a}
.btn.sm{padding:6px 11px;font-size:12.5px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.h2{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.1}
.head{display:flex;align-items:end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.sub{font-size:14px;color:var(--muted);margin-top:6px;max-width:60ch}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600}
.field input,.field select{width:100%;background:var(--bg);border:1px solid var(--line-2);border-radius:7px;padding:9px 11px;color:var(--ink);font:inherit;font-size:14px}
.field input:focus,.field select:focus{border-color:var(--gold);outline:none}
.chipset{display:flex;flex-wrap:wrap;gap:6px}
.chipset button,.filters button{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;color:var(--text)}
.chipset button[aria-pressed="true"],.filters button[aria-pressed="true"]{background:var(--gold);color:#16130a;border-color:var(--gold)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.filters .ct{opacity:.6;margin-left:4px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Header + tabs */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:24px 14px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.mark{font-family:var(--display);font-weight:700;font-size:42px;line-height:1;color:var(--ink)}
.mark span{color:var(--gold)}
.me{display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:16px;font-weight:800;color:#16130a;background:var(--gold);flex:none}
.me b{color:var(--ink);font-size:14px;display:block;line-height:1.2}
.me button{background:none;border:0;padding:0;color:var(--muted);font-size:12px}
.me button:hover{color:var(--gold)}
.tabs-shell{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-20px;padding-inline:20px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;padding:14px 13px 13px;color:var(--muted);font-weight:600;font-size:14px;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.panel{padding-top:28px}
.bottombar,.sheet{display:none}

/* Onboarding */
.ob{position:fixed;inset:0;z-index:60;background:rgba(5,5,6,.82);backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px;overflow-y:auto}
.ob-card{width:100%;max-width:520px;padding:28px;background:radial-gradient(90% 60% at 100% 0%,rgba(201,162,75,.18),transparent 60%),var(--surface);border:1px solid rgba(201,162,75,.3);border-radius:16px;display:flex;flex-direction:column;gap:16px}
.ob-card h2{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.05}

/* This Week */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:stretch}
.hero-main{padding:26px;display:flex;flex-direction:column;gap:18px;background:radial-gradient(80% 90% at 0% 0%,rgba(201,162,75,.16),transparent 60%),var(--surface)}
.hero-main h1{font-family:var(--display);font-weight:700;font-size:clamp(34px,5vw,56px);line-height:.98;letter-spacing:-.01em}
.hero-main h1 em{font-style:normal;color:var(--gold);text-transform:uppercase;letter-spacing:.03em}
.kw{font-style:normal;text-transform:uppercase;letter-spacing:.03em}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:auto}
.mini .big{font-family:var(--display);font-weight:700;font-size:32px;line-height:1;color:var(--gold)}
.mini .lbl{font-size:12.5px;color:var(--text);margin-top:6px;line-height:1.3}
.todo{padding:22px}
.checklist{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.checklist li{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;background:var(--surface-2);border-radius:8px;border:1px solid var(--line)}
.checklist input{appearance:none;width:20px;height:20px;border:1.5px solid var(--gold-soft);border-radius:5px;flex:none;margin-top:1px;display:grid;place-content:center;cursor:pointer}
.checklist input:checked{background:var(--gold);border-color:var(--gold)}
.checklist input:checked::after{content:"";width:10px;height:6px;border-left:2px solid #16130a;border-bottom:2px solid #16130a;transform:rotate(-45deg) translate(1px,-1px)}
.checklist label{color:var(--ink);cursor:pointer}
.checklist label small{display:block;color:var(--muted);font-size:13px;margin-top:1px}
.checklist li.done label{color:var(--muted);text-decoration:line-through}
details.data{margin-top:16px}
details.data>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);color:var(--ink);font-weight:700}
details.data>summary::-webkit-details-marker{display:none}
details.data>summary .chev{color:var(--gold);transition:transform .2s}
details.data[open]>summary .chev{transform:rotate(180deg)}
.grid-2{display:grid;grid-template-columns:1.55fr 1fr;gap:16px;align-items:start;margin-top:12px}
.chart{padding:20px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:3px}
.seg button{border:0;background:none;padding:6px 11px;border-radius:6px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--ink)}
.bars{display:flex;flex-direction:column;gap:11px;margin-top:18px}
.bar-row{display:grid;grid-template-columns:minmax(0,180px) 1fr;gap:14px;align-items:center}
.bar-row .name{font-size:13px;line-height:1.3;min-width:0}
.bar-row .name small{display:block;color:var(--muted);font-size:11px}
.track{position:relative;height:26px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.fill{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--gold-soft),var(--gold));border-radius:5px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.val{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;text-shadow:0 1px 2px rgba(0,0,0,.7)}
.note{margin-top:14px;font-size:12.5px;color:var(--muted)}
.reroll{padding:20px;display:flex;flex-direction:column;gap:14px}
.rr-bars{display:flex;align-items:flex-end;gap:18px;height:160px;border-bottom:1px solid var(--line-2)}
.rr-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:8px}
.rr-col .colbar{width:100%;max-width:90px;border-radius:6px 6px 0 0;background:linear-gradient(180deg,var(--gold),var(--gold-soft))}
.rr-col .colbar.small{background:#4a4740}
.rr-col .v{font-weight:800;color:var(--ink);font-size:16px}
.rr-labels{display:flex;gap:18px}
.rr-labels div{flex:1;text-align:center;font-size:12px;color:var(--muted)}
.finds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.find{text-align:left;display:grid;grid-template-columns:34px 1fr;gap:12px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.find:hover{border-color:var(--line-2)}
.find .n{font-family:var(--display);font-weight:700;color:var(--gold);font-size:18px;line-height:1.3}
.find .t{color:var(--ink);font-weight:600;font-size:14.5px;line-height:1.35;display:block}
.find .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:3px;display:block}
.find .b{font-size:13.5px;color:var(--text);margin-top:8px;display:block}
.lessons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.lesson{display:grid;grid-template-columns:38px minmax(0,1fr);gap:12px;padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.lesson .n{font-family:var(--display);font-weight:700;color:var(--gold);font-size:20px;line-height:1.2}
.lesson h3{font-size:17px;font-weight:700;line-height:1.3}
.lesson p{font-size:13.5px;color:var(--muted);margin:6px 0 12px}
.lesson p b{color:var(--gold);font-weight:700}
.lesson .chip{cursor:pointer}
.cta-strip{margin-top:26px;padding:18px 22px;border-radius:12px;background:radial-gradient(80% 140% at 100% 0%,rgba(201,162,75,.25),transparent 60%),var(--surface);border:1px solid rgba(201,162,75,.28);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.cta-strip b{color:var(--ink);font-size:16px}
.cta-strip span{color:var(--muted);font-size:13px}

/* Rules story */
.story{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line-2);aspect-ratio:16/8;max-height:600px;background:#0c0c0e;user-select:none}
.slide{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:center;gap:20px;padding:56px 48px 40px}
.slide .bigno{font-family:var(--display);font-weight:700;font-size:clamp(80px,13vw,170px);line-height:.8;color:var(--gold);opacity:.16;position:absolute;left:30px;bottom:14px;pointer-events:none}
.slide .txt{position:relative;z-index:1;display:flex;flex-direction:column;gap:16px}
.slide h3{font-family:var(--display);font-weight:700;font-size:clamp(30px,4.4vw,54px);line-height:1;letter-spacing:-.01em}
.slide .proof{font-size:17px;color:var(--text);max-width:34ch}
.slide .proof b{color:var(--gold)}
.slide .vis{position:relative;z-index:1;display:grid;place-items:center;height:100%;min-height:0}
.slide .vis svg{width:100%;max-width:380px;height:auto;display:block}
.prog{position:absolute;top:14px;left:14px;right:14px;display:flex;gap:4px;z-index:3}
.prog i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.18);overflow:hidden;position:relative}
.prog i b{position:absolute;inset:0;background:var(--ink);width:0}
.prog i.seen b{width:100%}
.prog i.now b{animation:fillbar var(--dur,7s) linear forwards}
.story.paused .prog i.now b{animation-play-state:paused}
@keyframes fillbar{from{width:0}to{width:100%}}
.tap{position:absolute;top:0;bottom:0;width:30%;z-index:2;background:none;border:0}
.tap.l{left:0}.tap.r{right:0}
.story-ctrl{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:700;color:var(--muted)}
.dots button[aria-current="true"]{background:var(--gold);color:#16130a;border-color:var(--gold)}
.tix{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;width:100%;max-width:360px}
.tix i{aspect-ratio:1.6;border-radius:4px;background:rgba(243,241,234,.08);border:1px solid rgba(243,241,234,.08);animation:tick 6s infinite}
@keyframes tick{0%,90%,100%{background:rgba(243,241,234,.08);box-shadow:none}93%,97%{background:var(--gold);box-shadow:0 0 18px rgba(201,162,75,.7)}}
.wave{display:flex;align-items:center;gap:4px;height:140px;width:100%;max-width:360px}
.wave i{flex:1;background:var(--gold);border-radius:2px;animation:wv 1.2s ease-in-out infinite}
@keyframes wv{0%,100%{height:15%}50%{height:90%}}

/* Hooks */
.subtabs{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px;gap:2px}
.subtabs button{border:0;background:none;padding:8px 16px;border-radius:7px;font-weight:700;font-size:14px;color:var(--muted)}
.subtabs button[aria-pressed="true"]{background:var(--gold);color:#16130a}
.hooks-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}
.hook-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.hook{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.hook:hover{border-color:var(--line-2)}
.hook[aria-pressed="true"]{border-color:var(--gold);background:linear-gradient(180deg,var(--gold-dim),transparent 70%),var(--surface)}
.hook .t{color:var(--ink);font-size:14px;font-weight:500;line-height:1.4}
.hook .t b{color:var(--gold)}
.hook .ty{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.editor{position:sticky;top:64px;display:flex;flex-direction:column;gap:14px}
.phone{position:relative;width:100%;max-width:260px;aspect-ratio:9/16;margin:0 auto;border-radius:28px;overflow:hidden;border:6px solid #1d1d20;box-shadow:0 30px 60px -20px rgba(0,0,0,.8),0 0 0 1px var(--line)}
.scene{position:absolute;inset:0;background:radial-gradient(120% 60% at 30% 20%,rgba(201,162,75,.55),transparent 60%),radial-gradient(90% 70% at 80% 75%,rgba(120,60,160,.55),transparent 65%),radial-gradient(70% 50% at 20% 90%,rgba(40,80,160,.5),transparent 70%),#08080a;background-size:160% 160%;animation:drift 14s ease-in-out infinite alternate}
.scene video,.scene img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scene.own::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25),transparent 40%,rgba(0,0,0,.45))}
@keyframes drift{0%{background-position:0% 0%}100%{background-position:100% 100%}}
.ph-top{position:absolute;top:0;left:0;right:0;padding:16px 16px 0;display:flex;justify-content:space-between;color:#fff;font-size:13px;font-weight:700;z-index:2}
.ph-prog{position:absolute;top:44px;left:14px;right:14px;height:2px;background:rgba(255,255,255,.25);border-radius:2px;overflow:hidden;z-index:2}
.ph-prog i{position:absolute;inset:0 auto 0 0;background:#fff;animation:prog 6s linear infinite}
@keyframes prog{from{width:0}to{width:100%}}
.ph-hook{position:absolute;left:16px;right:50px;top:26%;color:#fff;font-weight:800;font-size:18px;line-height:1.22;text-shadow:0 2px 12px rgba(0,0,0,.7);z-index:2}
.ph-empty{color:var(--gold);border-bottom:2px dashed var(--gold)}
.ph-side{position:absolute;right:10px;bottom:92px;display:flex;flex-direction:column;gap:18px;z-index:2}
.ph-side svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:1.8}
.ph-bottom{position:absolute;left:14px;right:54px;bottom:16px;color:#fff;font-size:12px;z-index:2}
.ph-bottom .h{font-weight:700;margin-bottom:4px}
.eq{display:flex;gap:3px;align-items:flex-end;height:14px;margin-top:8px}
.eq i{width:3px;background:#fff;border-radius:1px;animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}.eq i:nth-child(4){animation-delay:.1s}.eq i:nth-child(5){animation-delay:.3s}
@keyframes eq{0%,100%{height:3px}50%{height:14px}}
.fields{padding:16px;display:flex;flex-direction:column;gap:10px}
.wc{font-size:12px;color:var(--muted)}
.upl{position:relative;overflow:hidden}
.upl input{position:absolute;inset:0;opacity:0;cursor:pointer}
.caps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.cap{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;min-width:0}
.cap span{color:var(--ink);font-size:14px;min-width:0}
.cap button{flex:none;background:none;border:1px solid var(--line-2);border-radius:6px;padding:4px 9px;font-size:12px;font-weight:600;color:var(--muted)}
.cap button:hover{color:var(--gold);border-color:var(--gold-soft)}
.cap button.ok{color:var(--good);border-color:var(--good)}
.formula{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.piece{padding:9px 13px;border:1px solid var(--gold-soft);border-radius:8px;color:var(--ink);font-weight:700;font-size:13.5px;background:var(--gold-dim)}
.plus{color:var(--gold);font-family:var(--display);font-weight:700}

/* Concepts */
.exb{position:absolute;right:10px;top:9px;z-index:1;font-size:11px;font-weight:700;color:var(--bg);background:var(--gold);padding:2px 8px;border-radius:999px}
.cx{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:28px;align-items:start}
.cx-media iframe{display:block;width:100%;height:640px;border:1px solid var(--line);border-radius:12px;background:#fff}
.cx-link{display:inline-block;margin-top:8px;font-size:13px;color:var(--gold);text-decoration:none}
.cx-body{min-width:0}
@media(max-width:820px){.cx{grid-template-columns:1fr}.cx-media{max-width:400px}.cx-media iframe{height:580px}}
.cx-body .beats{grid-auto-flow:row;grid-template-columns:repeat(2,minmax(0,1fr));overflow:visible}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tile{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0;overflow:hidden;display:flex;flex-direction:column}
.tile:hover{border-color:var(--gold-soft)}
.frame{aspect-ratio:16/10;position:relative;overflow:hidden}
.frame video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

.beats{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(180px,1fr);gap:10px;overflow-x:auto;padding-bottom:6px;margin-top:12px}
.beat{padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.beat .ts{font-family:var(--display);font-weight:700;color:var(--gold);font-size:15px}
.beat p{font-size:13.5px;margin-top:6px;color:var(--ink)}
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}
.dbox{padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.dbox h4{margin:0 0 8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.dbox p{color:var(--ink);font-size:14px}
.dbox.avoid{border-left:2px solid var(--bad);border-radius:0 var(--r) var(--r) 0}
.hook-links{display:flex;flex-direction:column;gap:6px}
.hook-links button{text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:8px 10px;font-size:13.5px;color:var(--ink)}
.hook-links button:hover{border-color:var(--gold-soft)}
.hook-links b{color:var(--gold)}

.rel-top{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:stretch}

.countdown .d{font-family:var(--display);font-weight:700;font-size:64px;line-height:.9;color:var(--gold)}
.countdown .d small{font-family:var(--body);font-size:15px;color:var(--muted);font-weight:600;margin-left:6px}
.tl-wrap{padding:22px 20px 18px;overflow-x:auto;display:flex;align-items:center}
.rtl{position:relative;min-width:560px;width:100%;height:120px}
.rtl .line{position:absolute;left:0;right:0;top:44px;height:2px;background:var(--line-2)}
.rtl .line i{position:absolute;inset:0 auto 0 0;background:var(--gold)}
.ms{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;width:90px;text-align:center}
.ms .dd{font-size:11px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums;height:16px}
.ms .pt{width:16px;height:16px;border-radius:50%;background:var(--bg);border:2px solid var(--line-2);margin-top:12px}

.ms .lb{font-size:12px;color:var(--ink);font-weight:600;line-height:1.25}
.ms.alt .lb{margin-top:20px}
.ms.drop .pt{width:22px;height:22px;margin-top:9px;border-color:var(--gold)}
.phases{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px;align-items:start}
.phase{padding:18px}
.phase h3{font-size:16px;font-weight:700}
.ring{width:38px;height:38px}
.post-this{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}

/* Brand kit */
.bk{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:22px;align-items:start}

.stepc .sn h3{font-size:17px;font-weight:700}
.stepc .sn p{font-size:13px;color:var(--muted)}
.palettes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pal{border:1px solid var(--line);border-radius:9px;background:var(--surface-2);padding:6px;text-align:left}

.pal .strip{display:flex;height:34px;border-radius:5px;overflow:hidden}
.pal .strip i{flex:1}
.pal span{display:block;font-size:11.5px;font-weight:600;color:var(--text);margin-top:6px;padding-left:2px}
.custom{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
.custom label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:600}
.custom input[type=color]{width:34px;height:34px;border:1px solid var(--line-2);border-radius:7px;background:none;padding:0;cursor:pointer}
.syms{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.syms button{aspect-ratio:1;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);font-size:20px;color:var(--ink)}
.syms button[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-dim);color:var(--gold)}
.ig{position:sticky;top:64px;border-radius:22px;border:6px solid #1d1d20;overflow:hidden;box-shadow:0 30px 60px -20px rgba(0,0,0,.8)}
.ig-head{padding:18px 16px 12px;display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:center}
.ig-av{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:30px;border:3px solid}
.ig-stats{display:flex;justify-content:space-around;text-align:center;font-size:12px}
.ig-stats b{display:block;font-size:15px}
.ig-bio{padding:0 16px 12px;font-size:13px;line-height:1.4}
.ig-bio b{display:block;font-size:14px}

.ig-hl div{width:52px;text-align:center;font-size:10px}
.ig-hl i{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;border:2px solid;margin-bottom:4px;font-style:normal;font-size:16px}
.ig-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.ig-grid div{aspect-ratio:4/5;position:relative;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.04em;text-align:center;padding:6px}

/* Prompt builder */
.pb{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;align-items:start}
.pb-groups{display:flex;flex-direction:column;gap:16px;padding:20px}

.preset b{color:var(--ink);font-size:14px;display:block}
.preset span{font-size:12px;color:var(--muted)}

.tr-stat .s{font-size:12px;color:var(--muted);margin-top:2px}
.tr-grid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;align-items:start}
.form{padding:18px;display:flex;flex-direction:column;gap:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{font-size:13px;color:var(--bad)}
.spark{padding:16px 18px;margin-bottom:14px}
.spark svg{width:100%;height:auto;display:block}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:600px}
th{text-align:left;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--surface)}

.r{text-align:right;font-variant-numeric:tabular-nums}
.ex{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line-2);border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:2px}

.del{background:none;border:0;color:var(--muted);font-size:18px;line-height:1;padding:2px 6px}
.del:hover{color:var(--bad)}
.linkbtn{background:none;border:0;color:var(--gold);font-weight:600;padding:0}
.curves{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.curve{padding:16px}
.curve svg{width:100%;height:auto;display:block;margin:8px 0 10px}
.curve h3{font-size:15px;font-weight:700}
.curve .fix{font-size:13px;color:var(--ink)}
.curve .fix b{color:var(--gold)}
